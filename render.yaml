services:
  - type: web
    name: laqta
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: SERPAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: PROVIDERS
        value: serpapi
      - key: DEMO_MODE
        value: "false"
